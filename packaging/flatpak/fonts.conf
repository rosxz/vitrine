<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Vitrine Flatpak: follow the machine's own fonts as closely as possible.

       The GNOME runtime ships DejaVu Sans, which is heavier-looking than the
       font most NixOS/desktop hosts use for UI. Instead of hardcoding one family,
       we scan the HOST font directory first and, for the generic sans/UI families,
       prefer a font actually installed on the host. On the developer's machine
       that resolves to Source Han Sans; on anyone else's it follows their system
       default too. -->

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/run/host/fonts</dir>

  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans</string></edit>
  </match>
</fontconfig>