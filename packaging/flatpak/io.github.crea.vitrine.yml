  - name: gogdl
    buildsystem: simple
    build-commands:
      - install -Dm755 gogdl_linux_x86_64 /app/bin/gogdl
    sources:
      - type: file
        url: https://github.com/Heroic-Games-Launcher/heroic-gogdl/releases/download/v1.3.0/gogdl_linux_x86_64
        sha256: cba013d42767c808237c437335ab1d56f58405d07e8f37b3324d264ea5c49655

  - name: umu-launcher
    buildsystem: simple
    build-commands:
      - mkdir -p /app/libexec/vitrine/umu
      - cp umu-run umu_run.py /app/libexec/vitrine/umu/
      - chmod +x /app/libexec/vitrine/umu/umu-run
      - ln -sf /app/libexec/vitrine/umu/umu-run /app/bin/umu-run
    sources:
      - type: archive
        url: https://github.com/Open-Wine-Components/umu-launcher/releases/download/1.4.4/umu-launcher-1.4.4-zipapp.tar
        sha256: eb590691841f7fad3fc3ad8fd5db4ccb87849fe7948e62b28ece7a4ee48cc851

  - name: d3d-extras
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/vitrine/d3d_extras
      - cp -r . /app/share/vitrine/d3d_extras/
    sources:
      - type: archive
        url: https://github.com/lutris/d3d_extras/releases/download/v2/v2.tar.xz
        sha256: 9117ac86947b53865fc0d675314179e738b1e3e38bbb4281e4afe6b665b073af

  - name: vitrine
    buildsystem: simple
    build-commands:
      - cp -r vitrine /app/share/vitrine/vitrine
      - install -Dm644 packaging/flatpak/io.github.crea.vitrine.desktop /app/share/applications/io.github.crea.vitrine.desktop
      - install -Dm644 packaging/flatpak/io.github.crea.vitrine.metainfo.xml /app/share/metainfo/io.github.crea.vitrine.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/io.github.crea.vitrine.png /app/share/icons/hicolor/512x512/apps/io.github.crea.vitrine.png
      - install -Dm644 packaging/flatpak/icons/io.github.crea.vitrine.svg /app/share/icons/hicolor/scalable/apps/io.github.crea.vitrine.svg
      - install -Dm755 packaging/flatpak/vitrine-run.sh /app/bin/vitrine
    sources:
      - type: dir
        path: ../../