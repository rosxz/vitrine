id: io.github.crea.vitrine
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: vitrine

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # GPU drivers are supplied by the system via Flatpak's Mesa/GL extension.
  - --device=dri
  # Games and prefixes live under the user's home; the launcher must read and
  # write them. Steam libraries under ~/.local/share/Steam (native) and
  # ~/.var/app/com.valvesoftware.Steam (Flatpak Steam) are covered by this.
  - --filesystem=home
  # Hand steam://rungameid URIs to the host's own Steam via the OpenURI portal.
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.portal.Flatpak

build-options:
  build-args:
    - --share=network

modules:
  - name: python-requirements
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=/app ./*.whl
